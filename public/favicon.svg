<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Head -->
  <circle cx="30" cy="12" r="5" fill="black"/>
  <!-- Club -->
  <line x1="24" y1="5" x2="42" y2="18" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="20" y1="3" x2="24" y2="5" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <!-- Body/torso -->
  <line x1="30" y1="17" x2="28" y2="36" stroke="black" stroke-width="6" stroke-linecap="round"/>
  <!-- Left arm (holding club up) -->
  <polyline points="42,18 36,26 30,20" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm -->
  <line x1="30" y1="22" x2="36" y2="26" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="28" y1="36" x2="20" y2="58" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="28" y1="36" x2="38" y2="56" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Left foot -->
  <line x1="20" y1="58" x2="14" y2="61" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right foot -->
  <line x1="38" y1="56" x2="44" y2="58" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
</svg>
